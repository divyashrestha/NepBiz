name: tests

on:
    push:
        branches:
            - develop
            - main
    pull_request:
        branches:
            - develop
            - main

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    tools: composer:v2
                    coverage: none

            -   name: Setup Node
                uses: actions/setup-node@v7
                with:
                    node-version: '22'

            -   name: Setup Application
                run: composer setup

            -   name: Start Laravel Server
                uses: composer dev &

            -   name: Wait for Server
                run: sleep 5

            -   name: Run CI Checks
                run: composer ci:check
